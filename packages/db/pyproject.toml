[project]
name = "trading-db"
version = "0.1.0"
description = "SQL Server connection, settings, schema migrations and trading rules for the trading platform"
requires-python = ">=3.14"
dependencies = [
    "trading-core",
    "pymssql>=2.3.2",
]

[tool.uv.sources]
trading-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
