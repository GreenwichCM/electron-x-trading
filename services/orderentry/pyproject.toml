[project]
name = "trading-orderentry"
version = "0.1.0"
description = "Order entry service: pre-trade risk, throttle and the ElectronX order entry session"
requires-python = ">=3.14"
dependencies = [
    "trading-core",
    "trading-fix",
    "redis>=5.2.1",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
]

[tool.uv.sources]
trading-core = { workspace = true }
trading-fix = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
