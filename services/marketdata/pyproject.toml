[project]
name = "trading-marketdata"
version = "0.1.0"
description = "Market data service: ElectronX MD session -> order books -> Redis"
requires-python = ">=3.14"
dependencies = [
    "trading-core",
    "trading-fix",
    "redis>=5.2.1",
]

[tool.uv.sources]
trading-core = { workspace = true }
trading-fix = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
