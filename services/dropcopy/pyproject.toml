[project]
name = "trading-dropcopy"
version = "0.1.0"
description = "Drop copy service: the exchange's record of every fill, positions, and the break kill switch"
requires-python = ">=3.14"
dependencies = [
    "trading-core",
    "trading-fix",
    "redis>=5.2.1",
]

[tool.uv.sources]
trading-core = { workspace = true }
trading-fix = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
