[project]
name = "trading-riskmonitor"
version = "0.1.0"
description = "Risk monitor: positions, marks, P&L and limit usage per trader, and automatic trader blocks"
requires-python = ">=3.14"
dependencies = [
    "trading-core",
    "trading-db",
    "redis>=5.2.1",
]

[tool.uv.sources]
trading-core = { workspace = true }
trading-db = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
