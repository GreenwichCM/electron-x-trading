[project]
name = "trading"
version = "0.1.0"
description = "ElectronX trading platform (workspace root)"
requires-python = ">=3.14"
dependencies = [
    "trading-core",
    "trading-fix",
    "trading-sim",
    "trading-db",
    "trading-marketdata",
    "trading-api",
    "trading-orderentry",
    "trading-dropcopy",
    "trading-riskmonitor",
    "trading-recorder",
]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
trading-core = { workspace = true }
trading-fix = { workspace = true }
trading-sim = { workspace = true }
trading-db = { workspace = true }
trading-marketdata = { workspace = true }
trading-api = { workspace = true }
trading-orderentry = { workspace = true }
trading-dropcopy = { workspace = true }
trading-riskmonitor = { workspace = true }
trading-recorder = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
    "fakeredis>=2.26.2",
    "httpx2>=2.16.0",
    "honcho>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
